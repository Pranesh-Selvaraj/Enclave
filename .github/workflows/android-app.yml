name: Android app

# Builds and tests the native Android app in apps/android. The `Android`
# workflow only covers the Tauri shell under src-tauri/gen/android, so until
# now the app that replaces it was compiled by nobody but the developer (#210).
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'core/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (cmdline-tools + platform-tools)
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes `tools`, which was
          # removed from the SDK repository — installing it fails the step.
          packages: 'platform-tools'

      # The app compiles against SDK 36 (apps/android/app/build.gradle.kts).
      # The NDK is only needed by cargo-ndk: the module ships prebuilt .so
      # files under jniLibs and has no C sources of its own.
      - name: Install platform 36, build-tools 36.0.0 and NDK 29
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"

      - name: Add NDK toolchain to PATH (C build scripts need the clang wrappers)
        run: echo "$ANDROID_HOME/ndk/29.0.13846066/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # No extra apt packages: the host build of core-api (needed to generate
      # the bindings) links SQLCipher against the OpenSSL headers the
      # ubuntu-24.04 image already ships — the same step runs unmodified in the
      # `Android` workflow today. The Android targets themselves use vendored
      # OpenSSL.

      - name: Install Rust toolchain (arm64 + x86_64 Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Builds libcore_api.so per ABI and regenerates the committed Kotlin
      # bindings from the real FFI surface.
      - name: Build the core for Android
        run: ./apps/android/scripts/build-core.sh
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066

      # The generated bindings are committed, not built at Gradle time. A core
      # change that alters the FFI surface without regenerating them still
      # compiles and then fails at runtime, so fail here instead (#120).
      - name: Verify the committed Kotlin bindings are current
        run: git diff --exit-code -- apps/android/app/src/main/java/uniffi/

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: enclave-native-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-app-test-results
          path: apps/android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
