name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: npm install
        run: npm ci

      - name: Rust tests
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml

      - name: Svelte typecheck
        run: npm run check -w @enclave/frontend

      - name: TypeScript tests
        run: |
          for p in packages/editor packages/crypto packages/sync-engine; do
            npx tsx "$p/test.ts"
          done
          for t in apps/frontend/tests/*.test.ts; do
            npx tsx "$t"
          done

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            binary: enclave
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: enclave.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: enclave

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md --binarycaching
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: npm install
        run: npm ci

      - name: Pre-fetch AppImage bundler tools
        if: runner.os == 'Linux'
        run: |
          # The Tauri bundler downloads these once into ~/.cache/tauri with a
          # single request and no retry — one reset connection fails the whole
          # build (seen on v1.4.0). Pre-fetch them here so the bundler finds
          # them cached. Files must match the bundler's cache names exactly.
          mkdir -p "$HOME/.cache/tauri"
          files="
          https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh
          https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          "
          for url in $files; do
            f="$HOME/.cache/tauri/$(basename "$url")"
            [ -s "$f" ] && continue
            for i in 1 2 3 4 5; do
              if curl -fsSL --retry 3 --retry-all-errors -o "$f" "$url"; then break; fi
              echo "download failed (attempt $i/5): $url"
              sleep 5
            done
            [ -s "$f" ] || { echo "giving up on $url"; exit 1; }
            chmod +x "$f"
          done

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package source code
        run: |
          git archive --format=tar.gz -o artifacts/source.tar.gz HEAD
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
