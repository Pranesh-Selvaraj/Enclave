name: Android

on:
  push:
    # Release builds only — tag pushes produce the signed APK/AAB.
    # Post-merge main pushes are skipped: the pull_request trigger already
    # built this exact content on the merge-preview ref.
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Rapid commits to a PR cancel their superseded runs — one effective build
# per head commit instead of one per push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # release step attaches APK/AAB to tag releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (platform 36 + build-tools 36.0.0)
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0

      - name: Install NDK 29
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13846066"

      - name: Add NDK toolchain to PATH (C build scripts need the clang wrappers)
        run: echo "$ANDROID_HOME/ndk/29.0.13846066/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: npm install
        run: npm ci

      - name: Build release APK + AAB (arm64)
        working-directory: src-tauri
        run: npx tauri android build --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066

      - name: Sign APK + AAB
        run: bash scripts/android-sign.sh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          # Glob matches the signed APK on main (secrets present) and the
          # unsigned APK on fork PRs (signing skipped) — forks still get a
          # testable artifact and stay green.
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          if-no-files-found: warn

      # Desktop installers are attached to tag releases by build.yml; this
      # workflow is a separate run, so attach the Android artifacts here too.
      # softprops/action-gh-release handles the race when both workflows hit
      # the same tag: if the release was already created it updates it.
      - name: Attach APK + AAB to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
