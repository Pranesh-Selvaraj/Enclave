name: Android

on:
  push:
    # Release builds only — tag pushes produce the signed APK/AAB.
    # Post-merge main pushes are skipped: the pull_request trigger already
    # built this exact content on the merge-preview ref.
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Rapid commits to a PR cancel their superseded runs — one effective build
# per head commit instead of one per push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # release step attaches APK/AAB to tag releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (cmdline-tools + platform-tools)
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes `tools`, which was
          # removed from the SDK repository — installing it fails the step.
          packages: 'platform-tools'

      - name: Install platform 36, build-tools 36.0.0 and NDK 29
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"

      - name: Add NDK toolchain to PATH (C build scripts need the clang wrappers)
        run: echo "$ANDROID_HOME/ndk/29.0.13846066/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install cargo-ndk (builds the native shell's core .so)
        run: cargo install cargo-ndk --locked

      # The committed Kotlin bindings are generated, not hand-written. A
      # change to the core-api UniFFI surface without regenerating them
      # still compiles and fails at runtime, so fail here instead (#120).
      - name: Verify UniFFI Kotlin bindings match core-api
        working-directory: core
        run: |
          cargo build -p core-api --features uniffi
          cargo run -p core-api --features uniffi,cli --bin uniffi-bindgen -- \
            generate --library target/debug/libcore_api.so \
            --language kotlin --out-dir ../src-tauri/gen/android/app/src/main/java
          git diff --exit-code -- ../src-tauri/gen/android/app/src/main/java/uniffi/

      - name: npm install
        run: npm ci

      - name: Build release APK + AAB (arm64)
        working-directory: src-tauri
        run: npx tauri android build --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066

      # Runs after the build on purpose: the Tauri CLI generates the
      # gitignored tauri.settings.gradle / tauri.build.gradle.kts that Gradle
      # needs, and they do not exist on a fresh checkout (issue #137).
      - name: Android JVM unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:testUniversalDebugUnitTest
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066

      - name: Sign APK + AAB
        run: bash scripts/android-sign.sh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # Ed25519 signatures for the in-app updater (issue #83). Tag builds
      # only, like the release attachment below; unsigned releases fail
      # closed in the app.
      - name: Sign Android artifacts for the updater
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY is not set — refusing to publish unsigned assets"
            exit 1
          fi
          mapfile -t files < <(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab 2>/dev/null | sort)
          node scripts/sign-release.mjs "${files[@]}"

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          # Glob matches the signed APK on main (secrets present) and the
          # unsigned APK on fork PRs (signing skipped) — forks still get a
          # testable artifact and stay green.
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          if-no-files-found: warn

      # Desktop installers are attached to tag releases by build.yml; this
      # workflow is a separate run, so attach the Android artifacts here too.
      # softprops/action-gh-release handles the race when both workflows hit
      # the same tag: if the release was already created it updates it.
      - name: Attach APK + AAB to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk.sig
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab.sig
