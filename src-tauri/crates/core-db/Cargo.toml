[package]
name = "core-db"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
rusqlite = { version = "0.34", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Vector search (ANN) inside the same encrypted SQLCipher file.
sqlite-vec = "0.1.6"
