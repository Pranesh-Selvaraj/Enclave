[workspace]
members = ["crates/core-db", "crates/core-network"]
resolver = "2"

[package]
name = "enclave"
version = "1.3.0"
description = "Secure, local-first, zero-internet knowledge base"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "enclave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Internal Crates ──
core-db = { path = "crates/core-db" }
core-network = { path = "crates/core-network" }

# ── Tauri v2 Core ──
tauri = { version = "2", features = ["protocol-asset", "devtools", "tray-icon"] }

# ── Encrypted Local Database ──
rusqlite = { version = "0.34", features = ["bundled-sqlcipher"] }

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Self-update: checks GitHub Releases + streams the platform installer ──
# (rustls/ring, pure Rust — cross-compiles to Android; no OpenSSL needed)
ureq = { version = "~3.2" }

# ── Utilities ──
chrono = { version = "0.4", features = ["serde"] }
# Local embedding model (ONNX Runtime via fastembed) for fully-offline RAG.
# The model (~25 MB, all-MiniLM-L6-v2) downloads once into the app data dir
# on first use; chat still goes to the user-configured endpoint.
# rustls variants: no OpenSSL dependency, so it cross-compiles to Android.
# Excluded only on x86_64-linux-android (emulator-only target): ONNX Runtime
# ships no prebuilt binaries there — see the matching cfg gate in src/lib.rs.
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "sync"] }
tauri-plugin-dialog = "2"

[target.'cfg(not(all(target_os = "android", target_arch = "x86_64")))'.dependencies]
fastembed = { version = "5.17", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }

# Android: no system OpenSSL exists for the NDK, so build SQLCipher against
# a vendored OpenSSL compiled from source (openssl-src supports android).
# Desktop keeps using the system OpenSSL — unchanged build.
[target.'cfg(target_os = "android")'.dependencies]
rusqlite = { version = "0.34", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
