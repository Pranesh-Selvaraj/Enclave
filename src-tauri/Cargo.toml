[workspace]
members = ["crates/core-db", "crates/core-network"]
resolver = "2"

[package]
name = "enclave"
version = "1.1.0"
description = "Secure, local-first, zero-internet knowledge base"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "enclave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Internal Crates ──
core-db = { path = "crates/core-db" }
core-network = { path = "crates/core-network" }

# ── Tauri v2 Core ──
tauri = { version = "2", features = ["protocol-asset", "devtools", "tray-icon"] }

# ── Encrypted Local Database ──
rusqlite = { version = "0.34", features = ["bundled-sqlcipher"] }

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Utilities ──
chrono = { version = "0.4", features = ["serde"] }
# Local embedding model (ONNX Runtime via fastembed) for fully-offline RAG.
# The model (~25 MB, all-MiniLM-L6-v2) downloads once into the app data dir
# on first use; chat still goes to the user-configured endpoint.
fastembed = { version = "5.17", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "sync"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
