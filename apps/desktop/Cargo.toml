[package]
name = "enclave-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Enclave desktop — fully Rust shell over the shared Rust core"

[workspace]

[dependencies]
core-api = { path = "../../core/core-api" }
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
